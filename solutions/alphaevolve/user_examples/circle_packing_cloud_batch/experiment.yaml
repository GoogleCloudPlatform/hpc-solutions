title: "Circle Packing"
problem_description: "Evolve a constructor-based algorithm to pack N circles into a unit square, maximizing the sum of their radii."
program_language: "python"
primary_metric: "sum_of_radii"
initial_score: -1000000000000.0

seed_files:
  - "main.py"
  - "libpacking.cpp"

evaluator:
  script: "evaluator.py"
  method: "circle_packing_evaluation"
