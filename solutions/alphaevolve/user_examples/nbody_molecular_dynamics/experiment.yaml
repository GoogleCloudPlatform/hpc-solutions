title: "N-Body Gravity Simulation"
problem_description: "You are optimizing the pairwise gravity force calculation in a C++ N-Body molecular simulation inside main.cpp. The computational loop is currently O(N^2). Evolve the C++ code inside the EVOLVE-BLOCK using standard C++17 with MPI support. The headers <immintrin.h> and <x86intrin.h> are already pre-included globally at the top of main.cpp. You MUST NOT write any `#include` statements or `#pragma` target/option directives inside the EVOLVE-BLOCK, as C++ forbids them inside function bodies. The particle chunk bounds for the current rank process are defined by the variables `start_idx` and `end_idx`. You must ensure all loop index variables (such as `i` or `j`) are fully and properly declared in your block. You MUST NOT re-declare or duplicate variable names that are already declared elsewhere in the function scope. Use AVX/SIMD compiler intrinsics directly for vectorization. You must strictly maintain total energy conservation (final ENERGY_DRIFT must remain < 1e-4)."
program_language: "cpp"
primary_metric: "simulation_speed_score"
initial_score: -4500.0

seed_files:
  - "main.cpp"

evaluator:
  script: "evaluator.py"
  method: "evaluate_program"
