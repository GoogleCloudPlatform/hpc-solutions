title: "Airfoil Search Optimization"
problem_description: "Evolve a physics-aware search algorithm in Python to find the best 6 CST parameters of a 2D airfoil to maximize Cl/Cd (Lift-to-Drag ratio) within exactly 10 actual aerodynamic simulations.\n\nNote that the evaluation environment only supports standard libraries, numpy, scipy, and scikit-learn (1.8+). You can use scikit-learn (e.g., sklearn.gaussian_process) for surrogate models or regressor heuristics. Do NOT import or use other external packages like GPy, scikit-optimize, tensorflow, or torch, as they are not installed in the environment."
program_language: "python"
primary_metric: "lift_to_drag_ratio"
initial_score: 7.40

seed_files:
  - "main.py"

evaluator:
  script: "evaluator.py"
  method: "evaluate"
