title: "TPU Matrix Multiplication (GEMM) Optimization"
problem_description: "Evolve a high-performance tiled matrix multiplication (GEMM) algorithm in JAX optimized for Google Cloud TPU Matrix Multiply Units (MXUs). The algorithm takes input matrices A (M x K) and B (K x N) and computes C = A @ B. Optimize block tile sizes (Bm, Bk, Bn), memory staging and layout transpositions, systolic array alignment (multiples of 128 for TPU v5e/v6e), loop scheduling, and XLA kernel constructs (e.g., jax.lax.dot_general, jax.lax.scan, jax.lax.fori_loop, or custom chunked contracting loops) to maximize computational throughput in TFLOPS while strictly maintaining numerical correctness (relative L2 error <= 1e-3)."
program_language: "python"
primary_metric: "tflops"
initial_score: 0.1

seed_files:
  - "main.py"

evaluator:
  script: "evaluator.py"
  method: "tpu_gemm_evaluation"
