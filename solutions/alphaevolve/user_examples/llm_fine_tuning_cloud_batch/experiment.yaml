title: "LLM Fine-Tuning LoRA Optimization"
problem_description: "Evolve LoRA fine-tuning hyperparameters for Gemma 4 E2B on a function-calling dataset to minimize evaluation loss."
program_language: "python"
primary_metric: "neg_eval_loss"
initial_score: -100.0

seed_files:
  - "main.py"

evaluator:
  script: "evaluator.py"
  method: "llm_fine_tuning_evaluation"
